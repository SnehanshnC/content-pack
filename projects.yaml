  - slug: instructifai
    name: InstructifAI
    summary: Presentation coach using facial expression recognition, head-nod detection, and real-time speech transcription for timestamped feedback.
    links:
      press:
        label: Featured by Reach Capital
        url: https://www.linkedin.com/company/reach-capital/posts

  - slug: medify
    name: Medify
    summary: AI battlefield medicine assistant for wound assessment, treatment guidance, and supply-aware recommendations.
    notes:
