projects:
  - slug: synapse
    name: Synapse
    summary: AI learning companion that turns brain rot into brain nourishment.
    highlights:
      - GraphRAG over a Neo4j-backed knowledge graph to repurpose short-form video into educational maps, increasing objective retention by 80%.
      - iOS ReplayKit real-time WebSocket streaming pipeline.
      - OCR/Transcription backend pipeline extracting entities and using Gemini embeddings to map semantic relationships into the graph database, enabling cross-context retrieval.
    stack:
      - Next.js
      - Python
      - Neo4j
      - GraphRAG
      - pgvector
      - PyTesseract
    built_at: HackRU Fall 2025
    date: "2025-10"
    links:
      devpost:
        url: https://devpost.com/software/synapse-2bs4hv
      youtube:
        url: https://www.youtube.com/watch?v=v_MqGEB6GJM
      code:
        url: https://github.com/rayedchow/hackru-25
        note: repo lives on a teammate's account
    notes:
      - Also presented at Princeton Hackathon with a different UI.

  - slug: valence
    name: Valence
    summary: Market-based pricing layer for APIs, where pricing moves with demand, built with Solana and x402 payments.
    teammates:
      - Ashad Shaik-Mohamed
      - Yasser Zguiouar
      - Christian Dizon
    links:
      devfolio:
        url: https://devfolio.co/projects/fffff-ffa1

  - slug: jerseyctf
    name: JerseyCTF VI
    summary: Cybersecurity capture-the-flag competition hosted at NJIT.

  - slug: quarry
    name: Quarry
    summary: Schema-only data marketplace with AI-planned SQL previews and an x402 micropayment loop.
    highlights:
      - x402 micropayment loop where AI agents quote per-row cost, verify Solana transfers, and conditionally execute DuckDB queries to stream purchased Parquet slices, achieving ~100x faster payments.
    stack:
      - FastAPI
      - DuckDB
      - Next.js
      - TypeScript
      - Solana x402
      - IPFS
    built_at: HackRU
    date: "2025-12"
    links:
      code:
        url: https://github.com/rayedchow/quarry-ai
        note: repo lives on a teammate's account

  - slug: algora
    name: Algora
    summary: Auto job application engine that scrapes GitHub, Devpost, and LinkedIn, generates LLM cover letters, and autofills applications via Selenium.
    highlights:
      - Includes an application dashboard.
    links:
      devpost:
        url: https://devpost.com/software/algora
