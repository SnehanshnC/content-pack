          note: repo lives on a teammate's account

  - slug: honeyflow
    name: Honeyflow
    summary: Auto-pays every open source contributor in a dependency tree using AI attribution scores and ETH auto-distribution.
    highlights:
      - Crawls npm, PyPI, and arXiv for dependency and attribution data.
      - Human juror verification precedes ETH auto-distribution.
    teammates:
