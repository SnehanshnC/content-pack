  - slug: caps
    name: CAPS
    summary: AI interview anti-cheat tool combining screen and audio recording, lip-sync detection, and eye tracking into a trust score for recruiters.

  - slug: grokxads
    name: GrokXAds
    summary: Hyper-personalized native ads platform built for the xAI Hackathon.
    notes:
